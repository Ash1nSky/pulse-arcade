name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Scaffold Capacitor Android Project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.friends.pulsearcade",
            "appName": "Pulse Arcade",
            "webDir": "www",
            "backgroundColor": "#090b14",
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#090b14"
            }
          }
          EOF

          npx cap add android

      - name: 6. Generate Custom Neon Arcade Icon & Splash Screen
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p assets

          cat << 'EOF' > assets/icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <defs>
              <radialGradient id="bg" cx="50%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#1e295b"/>
                <stop offset="100%" stop-color="#090b14"/>
              </radialGradient>
              <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
            <!-- Background -->
            <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
            <!-- Outer Cyber Ring -->
            <circle cx="512" cy="512" r="370" fill="none" stroke="url(#neon)" stroke-width="36" stroke-opacity="0.85"/>
            <circle cx="512" cy="512" r="285" fill="none" stroke="#38bdf8" stroke-width="14" stroke-dasharray="65 35" stroke-opacity="0.5"/>
            <!-- Arcade Hex Core -->
            <polygon points="512,250 739,381 739,643 512,774 285,643 285,381" fill="#121728" stroke="url(#neon)" stroke-width="28" stroke-linejoin="round"/>
            <!-- Pulse Waveform -->
            <polyline points="230,512 390,512 455,345 565,680 635,512 794,512" fill="none" stroke="#38bdf8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="512" cy="512" r="28" fill="#ffffff"/>
          </svg>
          EOF

          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          rsvg-convert -w 2732 -h 2732 assets/icon.svg -o assets/splash.png

          npx @capacitor/assets generate --android --iconBackgroundColor '#090b14' --splashBackgroundColor '#090b14'

      - name: 7. Lock Portrait Orientation & Enable Immersive Fullscreen
        run: |
          # Patch AndroidManifest.xml for Portrait lock & Native Haptic Vibration
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            xml = xml.replace(
              "<activity",
              "<activity android:screenOrientation=\"portrait\""
            );
            xml = xml.replace(
              "</manifest>",
              "    <uses-permission android:name=\"android.permission.VIBRATE\" />\n</manifest>"
            );
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

          # Configure MainActivity.java for Sticky Immersive Fullscreen & Wake Lock
          cat << 'EOF' > android/app/src/main/java/com/friends/pulsearcade/MainActivity.java
          package com.friends.pulsearcade;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Keep display awake during races and co-op rounds
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  enableImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      enableImmersiveMode();
                  }
              }

              private void enableImmersiveMode() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                  }
              }
          }
          EOF

          npx cap sync android

      - name: 8. Compile Native Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Arcade-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
